services:
  kvstore:
    build: .
    container_name: kvstore
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    env_file: .env
    volumes:
      - kvstore_data:/data
    networks:
      - web

volumes:
  kvstore_data:

networks:
  web:
    external: true
